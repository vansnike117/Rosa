# Rosa
Rosa código qr
<!DOCTYPE html><html lang="es">
<head>
<meta charset="UTF-8">
<title>Para ti ❤️</title>
<style>
  body {
    margin: 0;
    background: black;
    overflow: hidden;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
  }canvas {
position: absolute;
top: 0;
left: 0;
}

#mensaje {
position: absolute;
width: 100%;
top: 70%;
font-size: 24px;
opacity: 0;
transition: opacity 2s;
}
</style>

</head>
<body><canvas id="canvas"></canvas>

<div id="mensaje"></div><script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const mensaje = document.getElementById("mensaje");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let t = 0;
let finished = false;

// 🌹 Dibujo tipo rosa
function drawRose() {
  ctx.strokeStyle = "red";
  ctx.lineWidth = 2;
  ctx.beginPath();

  for (let i = 0; i < t; i += 0.02) {
    let r = 150 * Math.sin(4 * i);
    let x = r * Math.cos(i);
    let y = r * Math.sin(i);

    ctx.lineTo(
      canvas.width / 2 + x,
      canvas.height / 2 - 100 + y
    );
  }

  ctx.stroke();
}

// ✨ Animación principal
function animate() {
  ctx.fillStyle = "rgba(0,0,0,0.1)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  drawRose();

  t += 0.05;

  if (t < Math.PI * 8) {
    requestAnimationFrame(animate);
  } else if (!finished) {
    finished = true;
    showMessage();
  }
}

// 💌 Texto animado
function showMessage() {
  const texto = "eres la niña más especial e importante en mi vida";
  let i = 0;

  mensaje.style.opacity = 1;

  let interval = setInterval(() => {
    mensaje.textContent += texto[i];
    i++;
    if (i >= texto.length) clearInterval(interval);
  }, 50);
}

// ❤️ Corazones al tocar
document.addEventListener("click", (e) => {
  for (let i = 0; i < 10; i++) {
    createHeart(e.clientX, e.clientY);
  }
});

function createHeart(x, y) {
  const heart = document.createElement("div");
  heart.innerHTML = "❤️";
  heart.style.position = "absolute";
  heart.style.left = x + "px";
  heart.style.top = y + "px";
  heart.style.fontSize = "20px";

  document.body.appendChild(heart);

  let up = 0;
  let anim = setInterval(() => {
    up += 2;
    heart.style.top = (y - up) + "px";
    heart.style.opacity -= 0.02;

    if (up > 100) {
      clearInterval(anim);
      heart.remove();
    }
  }, 16);
}

// Iniciar
animate();
</script></body>
        </html>
